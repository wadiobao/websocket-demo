<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Library Management</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 th:text="#{button.login}">Login</h1>
        
        <div id="error-container" class="error-message" th:if="${param.error}">
            <p th:text="#{error.invalid.password}">Invalid email or password!</p>
        </div>

        <div th:if="${param.logout}" class="logout-message">
            <p th:text="#{message.logout.success}">You have been logged out successfully!</p>
        </div>
        
        <div id="successMessage" class="success-message"></div>
        
        <div id="resetSection" class="reset-section">
            <h3 th:text="#{button.resetPassword}">Reset Password</h3>
            <div class="form-group">
                <label for="resetEmail" th:text="#{label.email}">Email:</label>
                <input type="email" id="resetEmail" th:placeholder="#{label.email}"/>
                <div id="resetEmailError" class="field-error" th:text="#{validation.email.invalid}">Invalid email</div>
                <div id="resetEmailSuccess" class="field-success">Valid email</div>
                <div class="validation-info" th:text="#{validation.email.invalid}">Email must be in a valid format (e.g., user@example.com)</div>
            </div>
            <div class="reset-actions">
                <button type="button" class="reset-btn" id="resetBtn" onclick="executeReset()" th:text="#{button.resetPassword}">Reset Password</button>
                <button type="button" class="cancel-btn" onclick="hideResetSection()" th:text="#{button.cancel}">Cancel</button>
            </div>
        </div>
        
        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="email" th:text="#{label.email}">Email:</label>
                <input type="text" id="email" name="email" required/>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{label.password}">Password:</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <div class="form-group">
                <div class="button-group">
                    <button type="submit" th:text="#{button.login}">Login</button>
                    <button type="button" class="reset-btn" onclick="showResetSection()" th:text="#{button.resetPassword}">Reset Password</button>
                </div>
            </div>
        </form>
        
        <div class="register-link">
            <span th:text="#{message.no.account}">Don't have an account?</span> <a href="/register" th:text="#{button.register}">Register now</a>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
